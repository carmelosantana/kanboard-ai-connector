# Tests, then builds and publishes the plugin zip when a vX.Y.Z tag is pushed.
# Managed from carmelosantana/kanboard-plugin-ci (templates/workflows/); update it with
# scripts/sync-workflows.sh there rather than by hand.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    uses: carmelosantana/kanboard-plugin-ci/.github/workflows/plugin-test.yml@d506a0a78c9c4d56fb6990c10da3d5887b62fa19 # harness 2026-11-27
  release:
    needs: test
    permissions:
      contents: write
    uses: carmelosantana/kanboard-plugin-ci/.github/workflows/plugin-release.yml@d506a0a78c9c4d56fb6990c10da3d5887b62fa19 # harness 2026-11-27
    with:
      ship-docs: false
